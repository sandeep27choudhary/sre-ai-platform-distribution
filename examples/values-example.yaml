# Example overlay — GHCR images + default UI admin identity.
# Login at http://localhost:3001/login: sreAdminEmail + sreAdminPassword (seeded on first API start).

createNamespace: true

imagePullSecrets: []

offlineMode: false

sreCore:
  replicas: 1
  image:
    repository: ghcr.io/sandeep27choudhary/sre-agent-api
    tag: latest
    pullPolicy: IfNotPresent

sreRag:
  worker:
    image:
      repository: ghcr.io/sandeep27choudhary/sre-agent-worker
      tag: latest
      pullPolicy: IfNotPresent

srePlatformUi:
  image:
    repository: ghcr.io/sandeep27choudhary/sre-agent-platform-ui
    tag: latest
    pullPolicy: IfNotPresent

llmGateway:
  image:
    repository: ghcr.io/sandeep27choudhary/sre-agent-llm-gateway
    tag: latest
    pullPolicy: IfNotPresent

license:
  key: ""
  signingSecret: ""
  publicKey: ""
  enforcement: permissive
  reloadIntervalSeconds: "300"
  trialStartEpoch: ""
  trialDays: 7

ingress:
  enabled: false

networkPolicies:
  enabled: false

config:
  jwtSecretKey: "CHANGEME-jwt-use-openssl-rand-hex-64"
  sreAdminEmail: "admin@sre.local"
  sreAdminPassword: "changeme"
  postgresPassword: "CHANGEME-postgres-password"
