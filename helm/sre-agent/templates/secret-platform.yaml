{{- if not .Values.config.existingPostgresSecret }}
{{- $secretName := printf "%s-platform" (include "sre-agent.fullname" .) }}
{{- $ns := include "sre-agent.namespace" . }}
{{- $existing := lookup "v1" "Secret" $ns $secretName }}

{{- /* Persist generated secrets across helm upgrades by reading existing values */}}
{{- $pgPass := "" }}
{{- $jwtKey := "" }}
{{- $adminPass := "" }}
{{- if $existing }}
  {{- $pgPass    = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
  {{- $jwtKey    = index $existing.data "JWT_SECRET_KEY"    | b64dec }}
  {{- $adminPass = index $existing.data "SRE_ADMIN_PASSWORD" | b64dec }}
{{- else }}
  {{- $pgPass    = .Values.config.postgresPassword | default (randAlphaNum 24) }}
  {{- $jwtKey    = .Values.config.jwtSecretKey     | default (randAlphaNum 64) }}
  {{- $adminPass = .Values.config.sreAdminPassword  | default (randAlphaNum 20) }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "sre-agent.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pgPass | quote }}
  JWT_SECRET_KEY: {{ $jwtKey | quote }}
  SRE_ADMIN_PASSWORD: {{ $adminPass | quote }}
  {{- if .Values.license.key }}
  LICENSE_KEY: {{ .Values.license.key | quote }}
  {{- end }}
  {{- if .Values.license.signingSecret }}
  LICENSE_SIGNING_SECRET: {{ .Values.license.signingSecret | quote }}
  {{- end }}
  {{- if .Values.license.publicKey }}
  LICENSE_PUBLIC_KEY_PEM: |
{{ .Values.license.publicKey | nindent 4 }}
  {{- end }}
  {{- if .Values.archive.enabled }}
  ARCHIVE_ACCESS_KEY: {{ .Values.archive.accessKey | quote }}
  ARCHIVE_SECRET_KEY: {{ .Values.archive.secretKey | quote }}
  {{- end }}
{{- end }}
