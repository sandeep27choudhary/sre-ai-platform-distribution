{{- if .Values.srePlatformUi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.srePlatformUi.name }}
  namespace: {{ include "sre-agent.namespace" . }}
  labels:
    app: {{ .Values.srePlatformUi.name }}
    app.kubernetes.io/component: sre-platform-ui
    {{- include "sre-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.srePlatformUi.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.srePlatformUi.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.srePlatformUi.name }}
        app.kubernetes.io/component: sre-platform-ui
        {{- include "sre-agent.labels" . | nindent 8 }}
    spec:
{{- include "sre-agent.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: sre-platform-ui
          image: "{{ .Values.srePlatformUi.image.repository }}:{{ .Values.srePlatformUi.image.tag }}"
          imagePullPolicy: {{ if .Values.offlineMode }}Never{{ else }}{{ .Values.srePlatformUi.image.pullPolicy }}{{ end }}
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_API_URL
              value: "http://api:8000"
          resources:
            {{- toYaml .Values.srePlatformUi.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.srePlatformUi.name }}
  namespace: {{ include "sre-agent.namespace" . }}
  labels:
    app: {{ .Values.srePlatformUi.name }}
    {{- include "sre-agent.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.srePlatformUi.name }}
  ports:
    - port: 80
      targetPort: 3000
      name: http
{{- end }}
