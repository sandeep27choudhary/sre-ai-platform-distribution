{{- if .Values.llmGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.llmGateway.name }}
  namespace: {{ include "sre-agent.namespace" . }}
  labels:
    app: {{ .Values.llmGateway.name }}
    app.kubernetes.io/component: llm-gateway
    {{- include "sre-agent.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.llmGateway.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.llmGateway.name }}
        app.kubernetes.io/component: llm-gateway
        {{- include "sre-agent.labels" . | nindent 8 }}
    spec:
{{- include "sre-agent.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ .Values.rbac.legacyServiceAccount }}
      containers:
        - name: llm-gateway
          image: "{{ .Values.llmGateway.image.repository }}:{{ .Values.llmGateway.image.tag }}"
          imagePullPolicy: {{ if .Values.offlineMode }}Never{{ else }}{{ .Values.llmGateway.image.pullPolicy }}{{ end }}
          ports:
            - containerPort: 8000
          env:
            - name: LLM_PROVIDER
              value: {{ .Values.llmGateway.provider | quote }}
            - name: OLLAMA_HOST
              value: {{ .Values.llmGateway.ollama.host | quote }}
            - name: OLLAMA_MODEL
              value: {{ .Values.llmGateway.ollama.model | quote }}
            - name: EMBED_MODEL
              value: {{ .Values.llmGateway.ollama.embedModel | quote }}
            {{- if .Values.llmGateway.existingSecret }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llmGateway.existingSecret }}
                  key: openai-api-key
                  optional: true
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llmGateway.existingSecret }}
                  key: openrouter-api-key
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llmGateway.existingSecret }}
                  key: gemini-api-key
                  optional: true
            {{- else }}
            - name: OPENAI_API_KEY
              value: {{ .Values.llmGateway.openai.apiKey | quote }}
            - name: OPENROUTER_API_KEY
              value: {{ .Values.llmGateway.openrouter.apiKey | quote }}
            - name: GEMINI_API_KEY
              value: {{ .Values.llmGateway.gemini.apiKey | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.llmGateway.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  namespace: {{ include "sre-agent.namespace" . }}
  labels:
    app: {{ .Values.llmGateway.name }}
    {{- include "sre-agent.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.llmGateway.name }}
  ports:
    - port: 8000
      targetPort: 8000
      name: http
{{- end }}
