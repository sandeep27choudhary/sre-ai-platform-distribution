{{- if .Values.loki.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.loki.name }}
  namespace: {{ include "sre-agent.namespace" . }}
  labels:
    app: {{ .Values.loki.name }}
    {{- include "sre-agent.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.loki.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.loki.name }}
        {{- include "sre-agent.labels" . | nindent 8 }}
    spec:
{{- include "sre-agent.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ .Values.rbac.legacyServiceAccount }}
      securityContext:
        runAsUser: 0
      containers:
        - name: loki
          image: "{{ .Values.loki.image.repository }}:{{ .Values.loki.image.tag }}"
          imagePullPolicy: {{ if .Values.offlineMode }}Never{{ else }}{{ .Values.loki.image.pullPolicy }}{{ end }}
          args: ["-config.file=/etc/loki/local-config.yaml"]
          ports:
            - containerPort: 3100
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /tmp/loki
          resources:
            {{- toYaml .Values.loki.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /ready, port: 3100 }
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /ready, port: 3100 }
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: {{ include "sre-agent.namespace" . }}
  labels:
    app: {{ .Values.loki.name }}
    {{- include "sre-agent.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.loki.name }}
  ports:
    - port: 3100
      targetPort: 3100
      name: http
{{- end }}
