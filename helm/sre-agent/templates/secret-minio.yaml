{{- if .Values.minio.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.minio.name }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.minio.name }}
    app.kubernetes.io/part-of: {{ include "sre-agent.fullname" . }}
type: Opaque
stringData:
  MINIO_ROOT_USER: {{ .Values.minio.rootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.minio.rootPassword | quote }}
{{- end }}
